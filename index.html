<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>50 Years in Weeks</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      background: #fafafa;
      color: #222;
      margin: 0;
      padding: 16px;
    }
    h1 { font-size: 1.4rem; margin: 0 0 4px; }
    p  { margin: 0 0 16px; color: #666; }
    button {
      margin-bottom: 16px;
      padding: 6px 12px;
      cursor: pointer;
    }
    .grid { display: flex; flex-direction: column; }
    .year { display: flex; }
    .week {
      flex: 1;
      max-width: 14px;
      aspect-ratio: 1;
      border: 1px solid #000;
      background: #fff;
      cursor: pointer;
      box-sizing: border-box;
    }
    .week:hover { border-color: #e53935; }
    .week.red { background: #e53935; }
  </style>
</head>
<body>
  <h1>50 Years in Weeks</h1>
  <p>50 years × 52 weeks = 2600 squares. Tap a square to color it red (tap again to clear).</p>
  <button id="reset">Clear all</button>
  <div class="grid" id="grid"></div>

  <script>
    const YEARS = 50;
    const WEEKS = 52;
    const DEFAULT_RED_YEARS = 28;
    const KEY = "weeks-red-v2";

    let saved = null;
    try { saved = JSON.parse(localStorage.getItem(KEY)); } catch (e) {}
    if (!Array.isArray(saved)) {
      saved = Array.from({ length: DEFAULT_RED_YEARS * WEEKS }, (_, i) => i);
    }
    const red = new Set(saved);

    function save() {
      try { localStorage.setItem(KEY, JSON.stringify([...red])); } catch (e) {}
    }

    const grid = document.getElementById("grid");
    for (let y = 0; y < YEARS; y++) {
      const row = document.createElement("div");
      row.className = "year";

      for (let w = 0; w < WEEKS; w++) {
        const i = y * WEEKS + w;
        const cell = document.createElement("div");
        cell.className = "week" + (red.has(i) ? " red" : "");
        cell.title = `Year ${y + 1}, week ${w + 1}`;
        cell.addEventListener("click", () => {
          cell.classList.toggle("red");
          cell.classList.contains("red") ? red.add(i) : red.delete(i);
          save();
        });
        row.appendChild(cell);
      }
      grid.appendChild(row);
    }

    document.getElementById("reset").addEventListener("click", () => {
      red.clear();
      save();
      document.querySelectorAll(".week.red").forEach(c => c.classList.remove("red"));
    });
  </script>
</body>
</html>
