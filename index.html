<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>50 Years in Weeks</title>
  <style>
    body {
      font-family: system-ui, sans-serif;
      background: #fafafa;
      color: #222;
      margin: 0;
      padding: 16px;
    }
    .pages { display: flex; gap: 16px; margin-bottom: 12px; }
    .pages a { color: #666; text-decoration: none; padding-bottom: 2px; }
    .pages a[aria-current] { color: #222; font-weight: 600; border-bottom: 2px solid #222; }
    h1 { font-size: 1.4rem; margin: 0 0 4px; }
    p  { margin: 0 0 16px; color: #666; }
    .controls {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 12px;
      margin-bottom: 16px;
    }
    .controls input { width: 64px; padding: 5px 6px; font-size: 1rem; }
    button { padding: 6px 12px; cursor: pointer; }
    .grid { display: flex; flex-direction: column; }
    .year { display: flex; }
    .week {
      flex: 1;
      max-width: 14px;
      aspect-ratio: 1;
      border: 1px solid #000;
      background: #fff;
      cursor: pointer;
      box-sizing: border-box;
    }
    .week:hover { border-color: #e53935; }
    .week.past { cursor: default; }
    .week.past:hover { border-color: #000; }
    .week.red { background: #e53935; }
    .week.now { background: #43a047; cursor: default; }
    .week.now:hover { border-color: #000; }
  </style>
</head>
<body>
  <nav class="pages"><a href="./" aria-current="page">Life in weeks</a><a href="spending.html">Spending</a><a href="days.html">Days</a></nav>
  <h1><span id="years-title">50</span> Years in Weeks</h1>
  <p>Born 6 March 1999. Weeks already lived are red, the current week is green, and both move forward automatically. Tap any future square to mark it (tap again to clear).</p>
  <div class="controls">
    <label>Years: <input type="number" id="years" min="1" max="120" value="50"></label>
    <button id="reset">Clear my marks</button>
  </div>
  <div class="grid" id="grid"></div>

  <script>
    const WEEKS = 52;
    const YEARS_KEY = "weeks-years";
    let years = 50;
    try { years = clampYears(localStorage.getItem(YEARS_KEY)) || 50; } catch (e) {}

    function clampYears(v) {
      const n = parseInt(v, 10);
      return n >= 1 ? Math.min(120, n) : null;
    }
    const BIRTH = new Date(1999, 2, 6); // 6 March 1999
    const KEY = "weeks-red-v3";

    // Number of fully lived weeks, counted per life year (52 per row).
    function weeksLived() {
      const today = new Date();
      let age = today.getFullYear() - BIRTH.getFullYear();
      let last = new Date(BIRTH.getFullYear() + age, BIRTH.getMonth(), BIRTH.getDate());
      if (last > today) {
        age--;
        last = new Date(BIRTH.getFullYear() + age, BIRTH.getMonth(), BIRTH.getDate());
      }
      const days = Math.floor((today - last) / 86400000);
      return age * WEEKS + Math.min(WEEKS, Math.floor(days / 7));
    }
    const PAST = weeksLived();

    // Squares tapped by hand (future weeks only).
    let saved = [];
    try { saved = JSON.parse(localStorage.getItem(KEY)) || []; } catch (e) {}
    const red = new Set(saved.filter(i => i >= PAST));

    // Cloud copy (when opened on claude.ai): saved to your account, so it
    // comes back on any device. localStorage is the fallback elsewhere.
    let cloudDoc = null;
    let cloudTimer = null;

    function save() {
      try {
        localStorage.setItem(KEY, JSON.stringify([...red]));
        localStorage.setItem(YEARS_KEY, String(years));
      } catch (e) {}
      if (cloudDoc) {
        clearTimeout(cloudTimer);
        cloudTimer = setTimeout(() => {
          cloudDoc.set({ red: [...red], years }).catch(() => {});
        }, 500);
      }
    }

    function paint() {
      document.querySelectorAll(".week").forEach((c, i) => {
        c.classList.toggle("red", i < PAST || (i > PAST && red.has(i)));
        c.classList.toggle("now", i === PAST);
      });
    }

    const grid = document.getElementById("grid");
    const yearsInput = document.getElementById("years");

    function build() {
      grid.innerHTML = "";
      yearsInput.value = years;
      document.getElementById("years-title").textContent = years;
      for (let y = 0; y < years; y++) {
        const row = document.createElement("div");
        row.className = "year";

        for (let w = 0; w < WEEKS; w++) {
          const i = y * WEEKS + w;
          const cell = document.createElement("div");
          cell.className = "week" + (i < PAST ? " past" : "");
          cell.title = `Year ${y + 1}, week ${w + 1}`;
          if (i > PAST) {
            cell.addEventListener("click", () => {
              red.has(i) ? red.delete(i) : red.add(i);
              paint();
              save();
            });
          }
          row.appendChild(cell);
        }
        grid.appendChild(row);
      }
      paint();
    }
    build();

    yearsInput.addEventListener("change", () => {
      const n = clampYears(yearsInput.value);
      if (!n) { yearsInput.value = years; return; }
      years = n;
      build();
      save();
    });

    document.getElementById("reset").addEventListener("click", () => {
      red.clear();
      save();
      paint();
    });

    (async () => {
      if (!window.claude) return;
      try {
        const [db, user] = await Promise.all([claude.use("db"), claude.use("user")]);
        const uid = user && await user.id();
        if (!db || !uid) return;
        const doc = db.doc("data/users/" + uid + "/weeks-v3");
        const snap = await doc.get();
        const data = snap.exists ? snap.data() : null;
        if (data && Array.isArray(data.red)) {
          red.clear();
          data.red.filter(i => i >= PAST).forEach(i => red.add(i));
          years = clampYears(data.years) || years;
          build();
          try { localStorage.setItem(KEY, JSON.stringify([...red])); } catch (e) {}
        }
        cloudDoc = doc;
        if (!data) save();
      } catch (e) {}
    })();
  </script>
</body>
</html>
